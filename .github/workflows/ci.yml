name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  validate:
    name: JSON / Python / JS checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate JSON files
        run: |
          python - <<'EOF'
          import glob, json, sys
          files = glob.glob("**/*.json", recursive=True)
          bad = []
          for f in files:
              try:
                  json.load(open(f, encoding="utf-8"))
              except Exception as e:
                  bad.append((f, str(e)))
          if bad:
              for f, e in bad:
                  print(f"INVALID JSON: {f} -> {e}")
              sys.exit(1)
          print(f"OK: {len(files)} JSON files valid")

      - name: Compile Python sources
        run: |
          python -m compileall -q .
          echo "OK: all Python files compile"

      - name: Check JS syntax
        run: |
          for f in $(find . -name '*.js' -not -path '*/node_modules/*'); do
            node --check "$f"
          done
          echo "OK: all JS files pass node --check"

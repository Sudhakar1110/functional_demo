name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  validate:
    name: JSON / Python / JS checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate JSON files
        run: |
          python - <<'EOF'
          import glob, json, sys
          files = glob.glob("**/*.json", recursive=True)
          bad = []
          for f in files:
              try:
                  json.load(open(f, encoding="utf-8"))
              except Exception as e:
                  bad.append((f, str(e)))
          if bad:
              for f, e in bad:
                  print(f"INVALID JSON: {f} -> {e}")
              sys.exit(1)
          print(f"OK: {len(files)} JSON files valid")

      - name: Compile Python sources
        run: |
          python -m compileall -q .
          echo "OK: all Python files compile"

      - name: Check JS syntax
        run: |
          for f in $(find . -name '*.js' -not -path '*/node_modules/*'); do
            node --check "$f"
          done
          echo "OK: all JS files pass node --check"

  tests:
    name: Server tests (Frappe + ERPNext)
    runs-on: ubuntu-latest
    needs: validate
    services:
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=10
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
    env:
      CI: "Yes"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install MariaDB client + bench
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client
          pip install frappe-bench

      - name: Init bench
        run: |
          bench init --skip-redis-config-generation --skip-assets --python "$(which python)" ~/frappe-bench
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"

      - name: Get apps
        working-directory: /home/runner/frappe-bench
        run: |
          bench get-app --branch version-15 frappe
          bench get-app --branch version-15 erpnext
          bench get-app functional_demo $GITHUB_WORKSPACE

      - name: Install app on test site
        working-directory: /home/runner/frappe-bench
        run: |
          bench new-site --db-root-password root --admin-password admin test_site
          bench --site test_site install-app erpnext functional_demo

      - name: Run tests
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site set-config allow_tests true
          bench --site test_site run-tests --app functional_demo

<script>
/* Portal pages: tiny vanilla-JS helpers (AJAX to whitelisted APIs + sidebar toggle).
   Included directly in every portal page template via the Jinja include tag (this
   comment is inside a Jinja-processed file, so no template tags may appear here).
   There is no hooks.web_include_js registration, so any NEW portal page must include
   this file explicitly or it silently loses the notification bell, modal/toast
   helpers and sidebar toggle. */

(function () {
	"use strict";

	/* Frappe injects the CSRF token as a small inline script (frappe.csrf_token =
	   "…") near the END of the page body, after our portal scripts. If portalCall
	   is invoked before that script runs, the token is empty and Frappe rejects
	   the request with 'Invalid Request'. So: read the token synchronously when
	   it exists, otherwise wait until the DOM (and the injected token) is ready.
	   NOTE: never write a literal closing script tag inside this comment - the
	   browser would end this script block there and print the rest as text. */
	function csrfToken() {
		var m = document.querySelector('meta[name="csrf-token"]');
		if (m && m.getAttribute("content")) return m.getAttribute("content");
		return window.csrf_token || (window.frappe && frappe.csrf_token) || "";
	}
	function csrfReady() {
		var t = csrfToken();
		if (t) return Promise.resolve(t);
		if (document.readyState !== "loading") return Promise.resolve("");
		return new Promise(function (resolve) {
			document.addEventListener("DOMContentLoaded", function () {
				resolve(csrfToken());
			});
		});
	}

	/* Show a centered modal popup (used for errors / attention messages). */
	window.portalModal = function (title, message, type) {
		type = type || "err";
		var old = document.getElementById("portal-modal");
		if (old) old.remove();
		var overlay = document.createElement("div");
		overlay.id = "portal-modal";
		overlay.className = "portal-modal show";
		var card = document.createElement("div");
		card.className = "pm-card pm-" + type;
		var icon = document.createElement("div");
		icon.className = "pm-icon";
		icon.textContent = type === "ok" ? "\u2713" : "!";
		var h = document.createElement("h3");
		h.className = "pm-title";
		h.textContent = title || (type === "ok" ? "Done" : "Something went wrong");
		var p = document.createElement("p");
		p.className = "pm-msg";
		p.textContent = message || "";
		var btn = document.createElement("button");
		btn.type = "button";
		btn.className = "btn-portal pm-btn";
		btn.textContent = "Got it";
		card.appendChild(icon);
		card.appendChild(h);
		card.appendChild(p);
		card.appendChild(btn);
		overlay.appendChild(card);
		document.body.appendChild(overlay);
		function close() {
			overlay.remove();
			document.removeEventListener("keydown", onKey, true);
		}
		function onKey(e) { if (e.key === "Escape") close(); }
		overlay.addEventListener("click", function (e) { if (e.target === overlay) close(); });
		btn.addEventListener("click", close);
		document.addEventListener("keydown", onKey, true);
	};

	/* Show a toast-style alert (auto-hides after 6s); errors open the modal popup. */
	window.portalAlert = function (msg, type) {
		if (type === "err") {
			window.portalModal("Please check your input", msg, "err");
			return;
		}
		var el = document.getElementById("portal-alert");
		if (!el) {
			el = document.createElement("div");
			el.id = "portal-alert";
			el.className = "portal-alert";
			document.body.appendChild(el);
		}
		el.textContent = msg;
		el.className = "portal-alert show " + (type || "ok");
		clearTimeout(el._t);
		el._t = setTimeout(function () { el.classList.remove("show"); }, 6000);
	};

	/* Call a whitelisted API method: window.portalCall("functional_demo.api.x", {..}) */
	window.portalCall = function (method, args, opts) {
		/* opts.silent: background/polling calls must never pop an error modal -
		   the caller decides (e.g. silent background refreshes should stay quiet
		   even if the endpoint is temporarily unavailable). */
		opts = opts || {};
		return csrfReady().then(function (token) {
			return fetch("/api/method/" + method, {
				method: "POST",
				headers: {
					"Content-Type": "application/json",
					"X-Frappe-CSRF-Token": token,
				},
				/* Send the payload flat (NOT wrapped in { args: ... }). Frappe v15
				   builds form_dict straight from the JSON body and then filters the
				   call's kwargs down to the method signature, so an 'args' wrapper
				   would be silently dropped and every method would receive empty
				   values (e.g. frappe.client.insert(doc) -> doc=None -> TypeError). */
				body: JSON.stringify(args || {}),
				credentials: "same-origin",
			});
		})
		.then(function (r) {
			return r.text().then(function (txt) {
				var data = {};
				try {
					data = JSON.parse(txt) || {};
				} catch (e) {
					// not JSON (e.g. an HTML 500 page) - keep the raw text for diagnosis
					data = { __raw: txt || "" };
				}
				return { ok: r.ok, data: data };
			});
		})
		.then(function (res) {
			var data = res.data;
			var serverMsgs = [];
			try {
				serverMsgs = JSON.parse(data._server_messages || "[]");
			} catch (e) { serverMsgs = []; }
			var plain = function (html) {
				var d = document.createElement("div");
				d.innerHTML = html || "";
				return d.textContent || d.innerText || "";
			};
			/* Frappe puts the real traceback in data.exc on unhandled exceptions.
			   Pull the last meaningful line ("ErrorType: message") so the popup
			   shows the actual cause instead of a generic message. When a method
			   called frappe.msgprint() and THEN raised, Frappe promotes the
			   msgprint text to data.message - which masks the real failure - so
			   the traceback line must win over data.message. */
			var realError = function () {
				var exc = String(data.exc || "").split("\n").filter(Boolean);
				for (var i = exc.length - 1; i >= 0; i--) {
					var line = exc[i].trim();
					if (!/^(File |Traceback|During handling|The above|\s*\^)/.test(line) && line.length > 2) {
						return line;
					}
				}
				return "";
			};
			/* For non-JSON error pages (HTML 500s) grab the first readable line
			   so the real failure is never hidden behind a generic message. */
			var rawHint = function () {
				if (!data.__raw) return "";
				var txt = String(data.__raw);
				var lines = txt.split("\n").map(function (l) { return l.trim(); }).filter(Boolean);
				for (var i = 0; i < lines.length; i++) {
					var line = lines[i].replace(/<[^>]+>/g, "").trim();
					if (line && line.length > 3 && !/^(<!|DOCTYPE|html|head|body|meta|script)/i.test(line)) {
						return line.slice(0, 300);
					}
				}
				return txt.slice(0, 300);
			};
			var isError = !res.ok || data.exc_type || data.raise_exception;
			if (isError) {
				/* Prefer the real traceback line, then the error message, then
				   any server message - in that order. data.message may be an
				   object (a return value) on odd responses, so only use strings. */
				var errMsg =
					realError() ||
					(typeof data.message === "string" ? data.message : "") ||
					(serverMsgs.length ? plain(serverMsgs[0]) : "") ||
					rawHint() ||
					"Something went wrong. Please try again.";
				if (!opts.silent) {
					window.portalModal(data.title || "Something went wrong", errMsg, "err");
				}
				var err = new Error(errMsg);
				err.exc_type = data.exc_type;
				throw err;
			}
				serverMsgs.forEach(function (s) {
					var t = plain(s);
					if (t) window.portalAlert(t, "ok");
				});
				return data.message;
			})
			.catch(function (err) {
				if (err instanceof TypeError && !opts.silent) {
					window.portalModal("Network error", "Please check your connection and try again.", "err");
				}
				throw err;
			});
	};

	/* Mobile sidebar toggle */
	document.addEventListener("DOMContentLoaded", function () {
		var toggle = document.getElementById("sidebar-toggle");
		var sidebar = document.getElementById("portal-sidebar");
		var overlay = document.querySelector(".sidebar-overlay");
		if (toggle && sidebar) {
			toggle.addEventListener("click", function () {
				sidebar.classList.toggle("open");
				if (overlay) overlay.classList.toggle("show");
			});
		}
		if (overlay) {
			overlay.addEventListener("click", function () {
				sidebar.classList.remove("open");
				overlay.classList.remove("show");
			});
		}
	});

	/* ---- portal notification bell (topbar, in-app alerts) ---- */
	(function () {
		var right = document.querySelector(".portal-topbar .topbar-right");
		if (!right) return;

		var wrap = document.createElement("div");
		wrap.className = "portal-notif";
		var btn = document.createElement("button");
		btn.type = "button";
		btn.className = "portal-notif-btn";
		btn.setAttribute("aria-label", "Notifications");
		btn.innerHTML =
			'<svg class="portal-notif-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>' +
			'<span class="portal-notif-badge" style="display:none;">0</span>';
		var panel = document.createElement("div");
		panel.className = "portal-notif-panel";
		panel.style.display = "none";

		wrap.appendChild(btn);
		wrap.appendChild(panel);
		right.insertBefore(wrap, right.firstChild);

		function esc(s) {
			return String(s == null ? "" : s)
				.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
				.replace(/"/g, "&quot;").replace(/'/g, "&#39;");
		}
		function docHref(n) {
			/* Stay inside the portal - notification links never open the desk */
			if (!n.document_type || !n.document_name) return "/demo_portal";
			if (n.document_type === "Demo Request") return "/sales_portal/demo_request?name=" + esc(n.document_name);
			if (n.document_type === "Demo Session") return "/functional_portal/session?name=" + esc(n.document_name);
			if (n.document_type === "Demo Follow Up") return "/functional_portal/follow_ups";
			return "/demo_portal";
		}
		function render(data) {
			var items = data.items || [];
			var unread = data.unread || 0;
			var badge = btn.querySelector(".portal-notif-badge");
			badge.textContent = unread;
			badge.style.display = unread > 0 ? "flex" : "none";

			var rows = items.map(function (n) {
				/* divs, not links - clicking a notification only marks it read and
				   never navigates away from the current page */
				return '<div class="portal-notif-item' + (n.read ? "" : " unread") + '" data-name="' + esc(n.name) + '">'
					+ '<div class="portal-notif-subject">' + esc(n.subject || "Notification") + "</div>"
					+ '<div class="portal-notif-meta">' + esc(n.creation || "") + "</div>"
					+ "</div>";
			}).join("");

			panel.innerHTML =
				'<div class="portal-notif-head">'
				+ "<span>Notifications</span>"
				+ (unread ? '<button type="button" class="portal-notif-markall" id="portal-notif-markall">Mark all read</button>' : "")
				+ "</div>"
				+ (rows || '<div class="portal-notif-empty">No notifications yet.</div>');
		}
		/* ---- popup notifications ----
		   The bell polls the Notification Log; when a notification the user has
		   not seen yet arrives, a green toast pops in top-right and auto-hides.
		   When the browser tab is in the background, a native OS-level popup
		   (Notification API) is shown instead so a notification is never missed,
		   plus a short chime. Permission is requested on the first user click
		   (browsers require a gesture) and on opening the bell. */
		var seenNames = {};
		var isFirstLoad = true;
		var nativeOk = false;

		function requestNativePermission() {
			if (!("Notification" in window)) return;
			if (Notification.permission === "granted") {
				nativeOk = true;
				setupWebPush();
				return;
			}
			if (Notification.permission !== "default") return; /* denied - do not nag */
			Notification.requestPermission()
				.then(function (p) {
					nativeOk = p === "granted";
					if (nativeOk) {
						window.portalAlert("Browser popups enabled - you will see notifications even when this tab is in the background.", "ok");
						setupWebPush();
					}
				})
				.catch(function () { /* permission prompt unavailable - in-page toast still works */ });
		}

		/* ---- Web Push (service worker) - OS-level popups with sound even when
		   the user is on another page/site entirely (or nothing is open but the
		   browser). Requires VAPID keys configured on the site; get_push_config
		   tells us whether they are. Best-effort: any failure keeps the in-app
		   bell + popups working. ---- */
		var pushReady = false;
		function urlBase64ToUint8Array(base64String) {
			var padding = "=".repeat((4 - (base64String.length % 4)) % 4);
			var base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
			var raw = window.atob(base64);
			var out = new Uint8Array(raw.length);
			for (var i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
			return out;
		}
		function setupWebPush() {
			if (pushReady) return;
			if (!("serviceWorker" in navigator) || !("PushManager" in window)) return;
			portalCall("functional_demo.api.get_push_config", {})
				.then(function (cfg) {
					if (!cfg || !cfg.enabled || !cfg.public_key) return; /* VAPID not configured */
					pushReady = true;
					return navigator.serviceWorker.register("/service_worker.js", { scope: "/" }).then(function (reg) {
						/* keep the existing subscription (re-save it), otherwise
						   create a fresh one for this browser */
						return reg.pushManager.getSubscription().then(function (existing) {
							if (existing) {
								return portalCall("functional_demo.api.subscribe_push", { subscription: JSON.stringify(existing) });
							}
							return reg.pushManager
								.subscribe({ userVisibleOnly: true, applicationServerKey: urlBase64ToUint8Array(cfg.public_key) })
								.then(function (sub) {
									return portalCall("functional_demo.api.subscribe_push", { subscription: JSON.stringify(sub) });
								});
						});
					});
				})
				.catch(function () { /* Web Push is best-effort - in-app popups still work */ });
		}
		/* browsers only allow the prompt after a user gesture - ask on the
		   first click anywhere on the page */
		(function bindNativePermission() {
			var done = false;
			function onFirst(e) {
				if (done) return;
				done = true;
				document.removeEventListener("click", onFirst, true);
				requestNativePermission();
			}
			document.addEventListener("click", onFirst, true);
		})();

		function playChime() {
			try {
				var Ctx = window.AudioContext || window.webkitAudioContext;
				if (!Ctx) return;
				var ctx = new Ctx();
				/* a clearly audible two-tone "ding-dong" chime (E5 + B5) - loud
				   enough to be heard even with the tab in the background */
				var tones = [
					{ freq: 659.25, start: 0, dur: 0.55 },
					{ freq: 987.77, start: 0.18, dur: 0.7 },
				];
				for (var i = 0; i < tones.length; i++) {
					var t = tones[i];
					var o = ctx.createOscillator();
					var g = ctx.createGain();
					o.connect(g);
					g.connect(ctx.destination);
					o.type = "triangle";
					o.frequency.value = t.freq;
					var start = ctx.currentTime + t.start;
					g.gain.setValueAtTime(0.0001, start);
					g.gain.exponentialRampToValueAtTime(0.55, start + 0.02);
					g.gain.exponentialRampToValueAtTime(0.0001, start + t.dur);
					o.start(start);
					o.stop(start + t.dur + 0.05);
				}
			} catch (e) { /* sound is a nicety - never break on it */ }
		}

		function nativePopup(subject, href) {
			if (!nativeOk || !("Notification" in window)) return;
			try {
				var n = new Notification(subject || "New notification", {
					body: "Sales & Functional Demo Management",
					icon: "/assets/functional_demo/images/brand_logo.jpg",
					tag: "demo-portal-" + Date.now(),
				});
				n.onclick = function () {
					/* read-only: clicking an OS popup never navigates away - it
					   only dismisses the notification */
					n.close();
				};
			} catch (e) { /* popup blocked - the in-page toast still shows */ }
		}

		function showToast(subject, href) {
			if (!subject) return;
			/* a plain div - clicking a notification only marks it read and
			   dismisses; it never navigates away from the current page */
			var toast = document.createElement("div");
			toast.className = "portal-toast";
			toast.innerHTML =
				'<span class="portal-toast-ic"><svg class="portal-notif-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg></span>'
				+ '<span class="portal-toast-body"><span class="portal-toast-label">New notification</span>'
				+ '<span class="portal-toast-subject">' + esc(subject) + "</span></span>"
				+ '<button type="button" class="portal-toast-close" aria-label="Dismiss">&times;</button>';
			document.body.appendChild(toast);
			/* trigger the enter animation */
			requestAnimationFrame(function () { toast.classList.add("show"); });
			var timer = setTimeout(function () { dismiss(); }, 8000);
			function dismiss() {
				clearTimeout(timer);
				toast.classList.remove("show");
				setTimeout(function () { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 350);
			}
			toast.querySelector(".portal-toast-close").addEventListener("click", function (e) {
				e.preventDefault();
				e.stopPropagation();
				dismiss();
			});
			/* clicking the toast marks notifications read and dismisses (no navigation) */
			toast.addEventListener("click", function () {
				portalCall("functional_demo.api.mark_portal_notifications_read", {}).catch(function () {});
				dismiss();
			});
		}

		function checkNew(data) {
			var items = (data && data.items) || [];
			if (isFirstLoad) {
				/* seed the seen-set with what is already in the bell - the user
				   does not need a popup for notifications that existed before
				   this page loaded */
				for (var i = 0; i < items.length; i++) seenNames[items[i].name] = 1;
				isFirstLoad = false;
				return;
			}
			for (var j = items.length - 1; j >= 0; j--) {
				var n = items[j];
				if (n.name && !seenNames[n.name]) {
					seenNames[n.name] = 1;
					if (!n.read) {
						var subject = n.subject || "New notification";
						var href = docHref(n);
						playChime();
						if (document.hidden) {
							/* tab in the background - show an OS-level popup so the
							   notification is never missed; the in-page toast also
							   appears so it is visible after switching back */
							nativePopup(subject, href);
							showToast(subject, href);
						} else {
							showToast(subject, href);
						}
					}
				}
			}
		}

		function load() {
			portalCall("functional_demo.api.get_portal_notifications", {})
				.then(function (data) {
					if (data) {
						render(data);
						checkNew(data);
					}
				})
				.catch(function () {
					/* silent - the bell is a convenience, never an error popup */
				});
		}

		btn.addEventListener("click", function () {
			/* opening the bell is an explicit intent - also ask for browser
			   popup permission here (a real user gesture) */
			requestNativePermission();
			var open = panel.style.display === "block";
			panel.style.display = open ? "none" : "block";
			if (!open) load();
		});

		/* ---- realtime (websocket) ----
		   Frappe ships a socket.io client in the web bundle, but on portal
		   (website) pages it is only loaded - never started (the desk starts
		   it). Start it here and subscribe so a new notification refreshes the
		   bell instantly with zero polling delay. Best-effort: if the websocket
		   cannot connect (e.g. redis / socketio not running on the bench), the
		   slow safety-net poll below still covers it. */
		function setupRealtime() {
			try {
				if (!window.frappe || !frappe.realtime || !frappe.realtime.init) return;
				if (!frappe.realtime.socket) frappe.realtime.init();
				frappe.realtime.on("demo_portal_notification", function () {
					load();
				});
			} catch (e) { /* realtime unavailable - the safety-net poll still covers it */ }
		}
		setupRealtime();

		/* safety-net poll when the websocket is unavailable - the realtime
		   subscription above delivers notifications instantly */
		setInterval(load, 60000);
		document.addEventListener("click", function (e) {
			if (!wrap.contains(e.target)) panel.style.display = "none";
		});
		/* after marking read, clear the unread styling + badge in the panel */
		function markAllReadUI() {
			var badge = btn.querySelector(".portal-notif-badge");
			badge.textContent = "0";
			badge.style.display = "none";
			var m = document.getElementById("portal-notif-markall");
			if (m) m.remove();
			var items = panel.querySelectorAll(".portal-notif-item");
			for (var i = 0; i < items.length; i++) items[i].classList.remove("unread");
		}

		panel.addEventListener("click", function (e) {
			var mark = e.target.closest ? e.target.closest("#portal-notif-markall") : null;
			if (mark) {
				e.preventDefault();
				portalCall("functional_demo.api.mark_portal_notifications_read", {})
					.then(markAllReadUI)
					.catch(function () {});
				return;
			}
			/* clicking a notification marks everything read (fire & forget) and
			   never navigates away from the current page */
			var item = e.target.closest ? e.target.closest(".portal-notif-item") : null;
			if (item && item.getAttribute("data-name")) {
				portalCall("functional_demo.api.mark_portal_notifications_read", {})
					.then(markAllReadUI)
					.catch(function () {});
			}
		});

		/* if permission was already granted on a previous visit, register the
		   service worker + subscribe right away (no click needed) */
		if ("Notification" in window && Notification.permission === "granted") {
			setupWebPush();
		}
		/* refresh the bell the moment the user comes back to this tab */
		document.addEventListener("visibilitychange", function () {
			if (!document.hidden) load();
		});

		load();
	})();

	/* Set the browser-tab favicon to the brand logo.
	   Replace any favicon link the base template already emitted so the
	   brand logo is the single deterministic tab icon. */
	(function () {
		var logo = "/assets/functional_demo/images/favicon.jpg";
		var existing = document.querySelectorAll('link[rel*="icon"]');
		for (var i = 0; i < existing.length; i++) existing[i].remove();
		var link = document.createElement("link");
		link.rel = "icon";
		link.type = "image/jpeg";
		link.href = logo;
		document.head.appendChild(link);
		var apple = document.createElement("link");
		apple.rel = "apple-touch-icon";
		apple.href = "/assets/functional_demo/images/brand_logo.jpg";
		document.head.appendChild(apple);
	})();
})();
</script>

<script>
/* Portal pages: tiny vanilla-JS helpers (AJAX to whitelisted APIs + sidebar toggle).
   Loaded on website pages via hooks.web_include_js. */

(function () {
	"use strict";

	/* Frappe injects the CSRF token as a small inline script (frappe.csrf_token =
	   "…") near the END of the page body, after our portal scripts. If portalCall
	   is invoked before that script runs, the token is empty and Frappe rejects
	   the request with 'Invalid Request'. So: read the token synchronously when
	   it exists, otherwise wait until the DOM (and the injected token) is ready.
	   NOTE: never write a literal closing script tag inside this comment - the
	   browser would end this script block there and print the rest as text. */
	function csrfToken() {
		var m = document.querySelector('meta[name="csrf-token"]');
		if (m && m.getAttribute("content")) return m.getAttribute("content");
		return window.csrf_token || (window.frappe && frappe.csrf_token) || "";
	}
	function csrfReady() {
		var t = csrfToken();
		if (t) return Promise.resolve(t);
		if (document.readyState !== "loading") return Promise.resolve("");
		return new Promise(function (resolve) {
			document.addEventListener("DOMContentLoaded", function () {
				resolve(csrfToken());
			});
		});
	}

	/* Show a centered modal popup (used for errors / attention messages). */
	window.portalModal = function (title, message, type) {
		type = type || "err";
		var old = document.getElementById("portal-modal");
		if (old) old.remove();
		var overlay = document.createElement("div");
		overlay.id = "portal-modal";
		overlay.className = "portal-modal show";
		var card = document.createElement("div");
		card.className = "pm-card pm-" + type;
		var icon = document.createElement("div");
		icon.className = "pm-icon";
		icon.textContent = type === "ok" ? "\u2713" : "!";
		var h = document.createElement("h3");
		h.className = "pm-title";
		h.textContent = title || (type === "ok" ? "Done" : "Something went wrong");
		var p = document.createElement("p");
		p.className = "pm-msg";
		p.textContent = message || "";
		var btn = document.createElement("button");
		btn.type = "button";
		btn.className = "btn-portal pm-btn";
		btn.textContent = "Got it";
		card.appendChild(icon);
		card.appendChild(h);
		card.appendChild(p);
		card.appendChild(btn);
		overlay.appendChild(card);
		document.body.appendChild(overlay);
		function close() {
			overlay.remove();
			document.removeEventListener("keydown", onKey, true);
		}
		function onKey(e) { if (e.key === "Escape") close(); }
		overlay.addEventListener("click", function (e) { if (e.target === overlay) close(); });
		btn.addEventListener("click", close);
		document.addEventListener("keydown", onKey, true);
	};

	/* Show a toast-style alert (auto-hides after 6s); errors open the modal popup. */
	window.portalAlert = function (msg, type) {
		if (type === "err") {
			window.portalModal("Please check your input", msg, "err");
			return;
		}
		var el = document.getElementById("portal-alert");
		if (!el) {
			el = document.createElement("div");
			el.id = "portal-alert";
			el.className = "portal-alert";
			document.body.appendChild(el);
		}
		el.textContent = msg;
		el.className = "portal-alert show " + (type || "ok");
		clearTimeout(el._t);
		el._t = setTimeout(function () { el.classList.remove("show"); }, 6000);
	};

	/* Call a whitelisted API method: window.portalCall("functional_demo.api.x", {..}) */
	window.portalCall = function (method, args) {
		return csrfReady().then(function (token) {
			return fetch("/api/method/" + method, {
				method: "POST",
				headers: {
					"Content-Type": "application/json",
					"X-Frappe-CSRF-Token": token,
				},
				/* Send the payload flat (NOT wrapped in { args: ... }). Frappe v15
				   builds form_dict straight from the JSON body and then filters the
				   call's kwargs down to the method signature, so an 'args' wrapper
				   would be silently dropped and every method would receive empty
				   values (e.g. frappe.client.insert(doc) -> doc=None -> TypeError). */
				body: JSON.stringify(args || {}),
				credentials: "same-origin",
			});
		})
		.then(function (r) {
			return r.text().then(function (txt) {
				var data = {};
				try {
					data = JSON.parse(txt) || {};
				} catch (e) {
					// not JSON (e.g. an HTML 500 page) - keep the raw text for diagnosis
					data = { __raw: txt || "" };
				}
				return { ok: r.ok, data: data };
			});
		})
		.then(function (res) {
			var data = res.data;
			var serverMsgs = [];
			try {
				serverMsgs = JSON.parse(data._server_messages || "[]");
			} catch (e) { serverMsgs = []; }
			var plain = function (html) {
				var d = document.createElement("div");
				d.innerHTML = html || "";
				return d.textContent || d.innerText || "";
			};
			/* Frappe puts the real traceback in data.exc on unhandled exceptions.
			   Pull the last meaningful line ("ErrorType: message") so the popup
			   shows the actual cause instead of a generic message. When a method
			   called frappe.msgprint() and THEN raised, Frappe promotes the
			   msgprint text to data.message - which masks the real failure - so
			   the traceback line must win over data.message. */
			var realError = function () {
				var exc = String(data.exc || "").split("\n").filter(Boolean);
				for (var i = exc.length - 1; i >= 0; i--) {
					var line = exc[i].trim();
					if (!/^(File |Traceback|During handling|The above|\s*\^)/.test(line) && line.length > 2) {
						return line;
					}
				}
				return "";
			};
			/* For non-JSON error pages (HTML 500s) grab the first readable line
			   so the real failure is never hidden behind a generic message. */
			var rawHint = function () {
				if (!data.__raw) return "";
				var txt = String(data.__raw);
				var lines = txt.split("\n").map(function (l) { return l.trim(); }).filter(Boolean);
				for (var i = 0; i < lines.length; i++) {
					var line = lines[i].replace(/<[^>]+>/g, "").trim();
					if (line && line.length > 3 && !/^(<!|DOCTYPE|html|head|body|meta|script)/i.test(line)) {
						return line.slice(0, 300);
					}
				}
				return txt.slice(0, 300);
			};
			var isError = !res.ok || data.exc_type || data.raise_exception;
			if (isError) {
				/* Prefer the real traceback line, then the error message, then
				   any server message - in that order. data.message may be an
				   object (a return value) on odd responses, so only use strings. */
				var errMsg =
					realError() ||
					(typeof data.message === "string" ? data.message : "") ||
					(serverMsgs.length ? plain(serverMsgs[0]) : "") ||
					rawHint() ||
					"Something went wrong. Please try again.";
				window.portalModal(data.title || "Something went wrong", errMsg, "err");
				var err = new Error(errMsg);
				err.exc_type = data.exc_type;
				throw err;
			}
				serverMsgs.forEach(function (s) {
					var t = plain(s);
					if (t) window.portalAlert(t, "ok");
				});
				return data.message;
			})
			.catch(function (err) {
				if (err instanceof TypeError) {
					window.portalModal("Network error", "Please check your connection and try again.", "err");
				}
				throw err;
			});
	};

	/* Mobile sidebar toggle */
	document.addEventListener("DOMContentLoaded", function () {
		var toggle = document.getElementById("sidebar-toggle");
		var sidebar = document.getElementById("portal-sidebar");
		var overlay = document.querySelector(".sidebar-overlay");
		if (toggle && sidebar) {
			toggle.addEventListener("click", function () {
				sidebar.classList.toggle("open");
				if (overlay) overlay.classList.toggle("show");
			});
		}
		if (overlay) {
			overlay.addEventListener("click", function () {
				sidebar.classList.remove("open");
				overlay.classList.remove("show");
			});
		}
	});

	/* ---- portal notification bell (topbar, in-app alerts) ---- */
	(function () {
		var right = document.querySelector(".portal-topbar .topbar-right");
		if (!right) return;

		var wrap = document.createElement("div");
		wrap.className = "portal-notif";
		var btn = document.createElement("button");
		btn.type = "button";
		btn.className = "portal-notif-btn";
		btn.setAttribute("aria-label", "Notifications");
		btn.innerHTML =
			'<svg class="portal-notif-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>' +
			'<span class="portal-notif-badge" style="display:none;">0</span>';
		var panel = document.createElement("div");
		panel.className = "portal-notif-panel";
		panel.style.display = "none";

		wrap.appendChild(btn);
		wrap.appendChild(panel);
		right.insertBefore(wrap, right.firstChild);

		function esc(s) {
			return String(s == null ? "" : s)
				.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
				.replace(/"/g, "&quot;").replace(/'/g, "&#39;");
		}
		function docHref(n) {
			/* Stay inside the portal - notification links never open the desk */
			if (!n.document_type || !n.document_name) return "/demo_portal";
			if (n.document_type === "Demo Request") return "/sales_portal/demo_request?name=" + esc(n.document_name);
			if (n.document_type === "Demo Session") return "/functional_portal/session?name=" + esc(n.document_name);
			if (n.document_type === "Demo Follow Up") return "/functional_portal/follow_ups";
			if (n.document_type === "Portal Chat Message") return "/chat";
			return "/demo_portal";
		}
		function render(data) {
			var items = data.items || [];
			var unread = data.unread || 0;
			var badge = btn.querySelector(".portal-notif-badge");
			badge.textContent = unread;
			badge.style.display = unread > 0 ? "flex" : "none";

			var rows = items.map(function (n) {
				return '<a class="portal-notif-item' + (n.read ? "" : " unread") + '" href="' + docHref(n) + '" data-name="' + esc(n.name) + '">'
					+ '<div class="portal-notif-subject">' + esc(n.subject || "Notification") + "</div>"
					+ '<div class="portal-notif-meta">' + esc(n.creation || "") + "</div>"
					+ "</a>";
			}).join("");

			panel.innerHTML =
				'<div class="portal-notif-head">'
				+ "<span>Notifications</span>"
				+ (unread ? '<button type="button" class="portal-notif-markall" id="portal-notif-markall">Mark all read</button>' : "")
				+ "</div>"
				+ (rows || '<div class="portal-notif-empty">No notifications yet.</div>');
		}
		function load() {
			portalCall("functional_demo.api.get_portal_notifications", {})
				.then(function (data) { if (data) render(data); })
				.catch(function () {
					/* silent - the bell is a convenience, never an error popup */
				});
		}

		btn.addEventListener("click", function () {
			var open = panel.style.display === "block";
			panel.style.display = open ? "none" : "block";
			if (!open) load();
		});

		/* keep the badge fresh while the user is on the page (e.g. new chat
		   messages arriving) without any interaction */
		setInterval(load, 30000);
		document.addEventListener("click", function (e) {
			if (!wrap.contains(e.target)) panel.style.display = "none";
		});
		panel.addEventListener("click", function (e) {
			var mark = e.target.closest ? e.target.closest("#portal-notif-markall") : null;
			if (mark) {
				e.preventDefault();
				portalCall("functional_demo.api.mark_portal_notifications_read", {})
					.then(function () {
						var badge = btn.querySelector(".portal-notif-badge");
						badge.textContent = "0";
						badge.style.display = "none";
						var m = document.getElementById("portal-notif-markall");
						if (m) m.remove();
						var items = panel.querySelectorAll(".portal-notif-item");
						for (var i = 0; i < items.length; i++) items[i].classList.remove("unread");
					})
					.catch(function () {});
				return;
			}
			/* clicking a notification marks everything read (fire & forget) */
			var item = e.target.closest ? e.target.closest(".portal-notif-item") : null;
			if (item && item.getAttribute("data-name")) {
				portalCall("functional_demo.api.mark_portal_notifications_read", {}).catch(function () {});
			}
		});

		load();
	})();

	/* Set the browser-tab favicon to the brand logo.
	   Replace any favicon link the base template already emitted so the
	   brand logo is the single deterministic tab icon. */
	(function () {
		var logo = "/assets/functional_demo/images/favicon.jpg";
		var existing = document.querySelectorAll('link[rel*="icon"]');
		for (var i = 0; i < existing.length; i++) existing[i].remove();
		var link = document.createElement("link");
		link.rel = "icon";
		link.type = "image/jpeg";
		link.href = logo;
		document.head.appendChild(link);
		var apple = document.createElement("link");
		apple.rel = "apple-touch-icon";
		apple.href = "/assets/functional_demo/images/brand_logo.jpg";
		document.head.appendChild(apple);
	})();
})();
</script>

<style>
@import url("https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap");

/* ==========================================================================
   Sales & Functional Demo Management - Portal UI
   ==========================================================================
   Design system: "Bizaxl Design System" (Portal_default_Design system.pdf)

   Colors  : Navy Dark #05133C · Navy Base #091526 · Mint #14F1B1
             Bright Blue #114EFF · White #FFFFFF · Gray 100 #F4F4F5
             Gray 400 #71717B · Success #00C950 · Black #0A0A0A
   Gradient: linear-gradient(90deg, #14F1B1 0%, #114EFF 50%, #091526 100%)
   Type    : DM Sans (Medium 500 / SemiBold 600 / Bold 700)
   Radii   : 8px (inputs) · 10px (buttons) · 12px (cards) · 16px (glass)
   Effects : Glassmorphism, subtle shadows, brand gradient accents
   ========================================================================== */

:root {
	/* brand tokens */
	--bx-navy: #05133C;
	--bx-navy-2: #091526;
	--bx-mint: #14F1B1;
	--bx-blue: #114EFF;
	--bx-white: #FFFFFF;
	--bx-gray-100: #F4F4F5;
	--bx-gray-300: #E5E7EB;
	--bx-gray-400: #71717B;
	--bx-gray-500: #737373;
	--bx-black: #0A0A0A;
	--bx-success: #00C950;

	--bx-gradient: linear-gradient(90deg, #14F1B1 0%, #114EFF 50%, #091526 100%);
	--bx-gradient-soft: linear-gradient(120deg, #05133C 0%, #114EFF 140%);

	--bx-radius-sm: 8px;
	--bx-radius-md: 10px;
	--bx-radius-lg: 12px;
	--bx-radius-xl: 16px;

	--bx-shadow-card: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
	--bx-shadow-lift: 0 14px 34px rgba(5, 19, 60, 0.16);

	--bx-sidebar-w: 264px;
	font-family: "DM Sans", "Inter", "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
}

/* ==========================================================================
   Layout shell — full viewport column: dark topbar on top, body below
   ========================================================================== */
body {
	margin: 0;
}

.portal-layout {
	display: flex;
	flex-direction: column;
	height: 100vh;
	height: 100dvh;
	overflow: hidden;
	font-family: "DM Sans", "Inter", "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
	background:
		radial-gradient(1200px 500px at 85% -10%, rgba(17, 78, 255, 0.07), transparent 60%),
		radial-gradient(900px 420px at -10% 20%, rgba(20, 241, 177, 0.06), transparent 55%),
		#F7F8FB;
	color: var(--bx-navy);
}

/* ==========================================================================
   Full-width dark top bar (logo left, title, user + Log Out right)
   ========================================================================== */
.portal-topbar {
	flex-shrink: 0;
	display: flex;
	align-items: center;
	gap: 16px;
	padding: 12px 24px;
	background: linear-gradient(90deg, #05133C 0%, #091526 100%);
	border-bottom: 1px solid rgba(20, 241, 177, 0.28);
	box-shadow: 0 6px 24px rgba(5, 19, 60, 0.35);
	z-index: 130;
}
.portal-topbar::after {
	content: "";
	position: absolute;
	left: 0;
	right: 0;
	bottom: -1px;
	height: 2px;
	background: var(--bx-gradient);
	opacity: 0.9;
}

.topbar-brand {
	display: flex;
	align-items: center;
	gap: 12px;
	color: #fff;
	text-decoration: none;
	flex-shrink: 0;
}
.topbar-brand:hover { color: #fff; text-decoration: none; }

.brand-logo {
	width: 40px;
	height: 40px;
	border-radius: 10px;
	object-fit: cover;
	flex-shrink: 0;
	box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.18), 0 6px 16px rgba(0, 0, 0, 0.4);
	background: rgba(255, 255, 255, 0.08);
}

.brand-text {
	line-height: 1.2;
	min-width: 0;
}
.brand-text .brand-name {
	display: block;
	font-weight: 700;
	font-size: 16px;
	letter-spacing: 0.2px;
	white-space: nowrap;
	overflow: hidden;
	text-overflow: ellipsis;
}
.brand-sub {
	display: block;
	font-size: 10.5px;
	font-weight: 500;
	opacity: 0.62;
	letter-spacing: 0.5px;
	text-transform: uppercase;
	margin-top: 2px;
}

.topbar-title {
	flex: 1;
	min-width: 0;
}
.topbar-title h1 {
	font-size: 18px;
	font-weight: 700;
	margin: 0;
	color: #fff;
	letter-spacing: -0.2px;
	white-space: nowrap;
	overflow: hidden;
	text-overflow: ellipsis;
}
.topbar-title p {
	margin: 1px 0 0;
	font-size: 12.5px;
	color: rgba(255, 255, 255, 0.6);
	white-space: nowrap;
	overflow: hidden;
	text-overflow: ellipsis;
}

.topbar-right {
	margin-left: auto;
	display: flex;
	align-items: center;
	gap: 12px;
	flex-shrink: 0;
}
.portal-avatar {
	width: 34px;
	height: 34px;
	border-radius: 50%;
	background: var(--bx-gradient);
	color: #fff;
	font-weight: 700;
	font-size: 14px;
	display: flex;
	align-items: center;
	justify-content: center;
	box-shadow: 0 0 0 3px rgba(20, 241, 177, 0.18);
}
.portal-user-name { font-size: 14px; font-weight: 600; color: #fff; }

.btn-logout {
	display: inline-flex;
	align-items: center;
	gap: 6px;
	background: transparent;
	color: #fff;
	border: 1px solid rgba(255, 255, 255, 0.35);
	border-radius: var(--bx-radius-md);
	padding: 7px 16px;
	font-size: 13px;
	font-weight: 600;
	text-decoration: none;
	cursor: pointer;
	transition: all 0.15s ease;
}
.btn-logout:hover {
	background: #F43F5E;
	border-color: #F43F5E;
	color: #fff;
	box-shadow: 0 6px 18px rgba(244, 63, 94, 0.4);
	text-decoration: none;
}

/* ==========================================================================
   Body row: menu-only sidebar (edge to edge) + main content
   ========================================================================== */
.portal-body {
	display: flex;
	flex: 1;
	min-height: 0;
	overflow: hidden;
}

.portal-sidebar {
	width: var(--bx-sidebar-w);
	flex-shrink: 0;
	background: linear-gradient(180deg, #05133C 0%, #091526 82%);
	color: #fff;
	display: flex;
	flex-direction: column;
	box-shadow: 4px 0 24px rgba(5, 19, 60, 0.24);
	z-index: 120;
	/* sidebar lives inside the locked (non-scrolling) page, so it is always
	   fully visible; only its own menu scrolls if the viewport is short */
	overflow-y: auto;
}

/* brand gradient hairline along the sidebar's inner edge */
.portal-sidebar::before {
	content: "";
	position: absolute;
	top: 0;
	right: 0;
	width: 3px;
	height: 100%;
	background: var(--bx-gradient);
	opacity: 0.85;
}

.sidebar-menu {
	flex: 1;
	padding: 16px 12px;
}
.sidebar-menu::-webkit-scrollbar { width: 4px; }
.sidebar-menu::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.18); border-radius: 99px; }

.sidebar-item {
	display: flex;
	align-items: center;
	gap: 12px;
	color: rgba(255, 255, 255, 0.78);
	padding: 10px 12px;
	margin-bottom: 4px;
	border-radius: var(--bx-radius-md);
	font-size: 14px;
	font-weight: 500;
	text-decoration: none;
	position: relative;
	transition: background 0.16s ease, color 0.16s ease, transform 0.12s ease;
}
.sidebar-item:hover {
	background: rgba(255, 255, 255, 0.08);
	color: #fff;
	text-decoration: none;
	transform: translateX(2px);
}
.sidebar-item.active {
	background: #fff;
	color: var(--bx-navy);
	font-weight: 700;
	box-shadow: 0 6px 18px rgba(0, 0, 0, 0.28);
}
.sidebar-item.active::before {
	content: "";
	position: absolute;
	left: -12px;
	top: 50%;
	transform: translateY(-50%);
	width: 4px;
	height: 22px;
	border-radius: 0 4px 4px 0;
	background: var(--bx-mint);
	box-shadow: 0 0 12px rgba(20, 241, 177, 0.7);
}

.sidebar-icon {
	width: 28px;
	height: 28px;
	border-radius: var(--bx-radius-sm);
	background: rgba(255, 255, 255, 0.1);
	display: flex;
	align-items: center;
	justify-content: center;
	font-size: 15px;
	flex-shrink: 0;
	transition: background 0.16s ease;
}
.sidebar-item.active .sidebar-icon { background: rgba(20, 241, 177, 0.18); }

.sidebar-footer {
	padding: 14px 16px;
	border-top: 1px solid rgba(255, 255, 255, 0.08);
	/* keep the footer reachable even when the sidebar stretches tall */
	position: sticky;
	bottom: 0;
	background: linear-gradient(180deg, rgba(9, 21, 38, 0.85), #091526 90%);
	backdrop-filter: blur(3px);
}
.sidebar-desk {
	display: flex;
	align-items: center;
	justify-content: center;
	gap: 8px;
	background: rgba(255, 255, 255, 0.08);
	color: #fff;
	border: 1px solid rgba(255, 255, 255, 0.14);
	border-radius: var(--bx-radius-md);
	padding: 10px 12px;
	font-size: 13px;
	font-weight: 600;
	text-decoration: none;
	transition: background 0.16s ease, border-color 0.16s ease;
}
.sidebar-desk:hover {
	background: rgba(255, 255, 255, 0.16);
	border-color: rgba(20, 241, 177, 0.5);
	color: #fff;
	text-decoration: none;
}

/* mobile sidebar overlay */
.sidebar-overlay {
	display: none;
	position: fixed;
	inset: 0;
	background: rgba(5, 19, 60, 0.5);
	backdrop-filter: blur(3px);
	z-index: 110;
}
.sidebar-overlay.show { display: block; }

/* desktop sidebar sticks below the fixed-height topbar (40px logo + 24px padding + 1px border) */

/* ==========================================================================
   Main column
   ========================================================================== */
.portal-main {
	flex: 1;
	min-width: 0;
	min-height: 0;
	display: flex;
	flex-direction: column;
	/* only the right-hand content scrolls; sidebar + topbar stay fixed */
	overflow-y: auto;
}

.sidebar-toggle {
	display: none;
	background: none;
	border: 1px solid rgba(255, 255, 255, 0.35);
	border-radius: var(--bx-radius-sm);
	font-size: 20px;
	line-height: 1;
	padding: 6px 10px;
	cursor: pointer;
	color: #fff;
	flex-shrink: 0;
}
.sidebar-toggle:hover { background: rgba(255, 255, 255, 0.12); }

.portal-content {
	padding: 28px;
	max-width: 1280px;
	width: 100%;
	box-sizing: border-box;
	margin: 0 auto;
}

/* dashboard greeting (home pages) */
.dash-greet {
	background:
		radial-gradient(700px 300px at 90% -20%, rgba(17, 78, 255, 0.45), transparent 60%),
		radial-gradient(500px 260px at -5% 120%, rgba(20, 241, 177, 0.22), transparent 55%),
		linear-gradient(120deg, #05133C 0%, #091526 70%);
	border-radius: var(--bx-radius-xl);
	color: #fff;
	padding: 28px 30px;
	margin-bottom: 26px;
	box-shadow: 0 14px 40px rgba(5, 19, 60, 0.3);
	position: relative;
	overflow: hidden;
	display: flex;
	align-items: center;
	justify-content: space-between;
	gap: 20px;
	flex-wrap: wrap;
}
.dash-greet::before {
	content: "";
	position: absolute;
	left: 0;
	top: 0;
	height: 3px;
	width: 100%;
	background: var(--bx-gradient);
}
.dash-greet .greet-eyebrow {
	display: inline-flex;
	align-items: center;
	gap: 7px;
	background: rgba(20, 241, 177, 0.14);
	border: 1px solid rgba(20, 241, 177, 0.35);
	color: var(--bx-mint);
	padding: 3px 12px;
	border-radius: 999px;
	font-size: 12px;
	font-weight: 600;
	letter-spacing: 0.4px;
	margin-bottom: 10px;
}
.dash-greet h1 {
	margin: 0;
	font-size: 27px;
	font-weight: 700;
	letter-spacing: -0.4px;
}
.dash-greet p {
	margin: 6px 0 0;
	opacity: 0.85;
	font-size: 14px;
	max-width: 620px;
	line-height: 1.6;
}
.dash-greet .greet-actions {
	display: flex;
	gap: 10px;
	flex-wrap: wrap;
}

/* ==========================================================================
   Buttons — mint primary / navy secondary / white tertiary
   ========================================================================== */
.btn-portal {
	display: inline-flex;
	align-items: center;
	justify-content: center;
	gap: 6px;
	background: var(--bx-mint);
	color: var(--bx-navy);
	border: none;
	border-radius: var(--bx-radius-md);
	padding: 8px 20px;
	font-size: 14px;
	font-weight: 700;
	min-width: 140px;
	height: 40px;
	box-sizing: border-box;
	cursor: pointer;
	text-decoration: none;
	transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease;
}
.btn-portal:hover {
	background: #0FDFA4;
	color: var(--bx-navy);
	transform: translateY(-1px);
	box-shadow: 0 8px 20px rgba(20, 241, 177, 0.35);
	text-decoration: none;
}
.btn-portal:active { transform: translateY(0) scale(0.97); box-shadow: none; }

/* navy secondary */
.btn-portal.secondary {
	background: var(--bx-navy);
	color: #fff;
	min-width: 166px;
}
.btn-portal.secondary:hover {
	background: var(--bx-navy-2);
	color: #fff;
	box-shadow: 0 8px 20px rgba(5, 19, 60, 0.35);
}

/* white tertiary with navy outline */
.btn-portal.tertiary {
	background: #fff;
	color: var(--bx-navy);
	border: 1px solid rgba(5, 19, 60, 0.5);
	min-width: 160px;
	box-shadow: none;
}
.btn-portal.tertiary:hover { background: var(--bx-gray-100); box-shadow: none; }

.btn-portal.success { background: var(--bx-success); color: var(--bx-navy); }
.btn-portal.success:hover { background: #00B549; color: var(--bx-navy); box-shadow: 0 8px 20px rgba(0, 201, 80, 0.3); }
.btn-portal.danger { background: #F43F5E; color: #fff; }
.btn-portal.danger:hover { background: #E11D48; color: #fff; box-shadow: 0 8px 20px rgba(244, 63, 94, 0.3); }
.btn-portal.warning { background: #F59E0B; color: var(--bx-navy); }
.btn-portal.warning:hover { background: #D97706; color: #fff; box-shadow: 0 8px 20px rgba(245, 158, 11, 0.3); }

.btn-portal.sm {
	padding: 5px 14px;
	font-size: 13px;
	min-width: 0;
	height: 32px;
	border-radius: var(--bx-radius-sm);
}
.btn-portal:disabled { opacity: 0.55; cursor: not-allowed; transform: none; box-shadow: none; }

/* ==========================================================================
   KPI cards
   ========================================================================== */
.kpi-grid {
	display: grid;
	grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
	gap: 16px;
	margin-bottom: 26px;
}
.kpi-card {
	background: #fff;
	border: 1px solid var(--bx-gray-100);
	border-radius: var(--bx-radius-lg);
	padding: 18px 18px 16px;
	box-shadow: var(--bx-shadow-card);
	position: relative;
	overflow: hidden;
	transition: transform 0.16s ease, box-shadow 0.16s ease;
}
.kpi-card::after {
	content: "";
	position: absolute;
	left: 0;
	right: 0;
	top: 0;
	height: 3px;
	background: var(--bx-gradient);
	opacity: 0;
	transition: opacity 0.16s ease;
}
.kpi-card:hover {
	transform: translateY(-3px);
	box-shadow: var(--bx-shadow-lift);
}
.kpi-card:hover::after { opacity: 1; }

.kpi-card .kpi-label {
	font-size: 11.5px;
	color: var(--bx-gray-400);
	font-weight: 600;
	text-transform: uppercase;
	letter-spacing: 0.6px;
}
.kpi-card .kpi-value {
	font-size: 30px;
	font-weight: 700;
	color: var(--bx-navy);
	margin-top: 6px;
	line-height: 1;
	letter-spacing: -0.5px;
}
.kpi-card .kpi-note { font-size: 12px; color: var(--bx-gray-400); margin-top: 7px; }

.kpi-card.kpi-green .kpi-value { color: #00A356; }
.kpi-card.kpi-amber .kpi-value { color: #D97706; }
.kpi-card.kpi-red .kpi-value { color: #E11D48; }
.kpi-card.kpi-blue .kpi-value { color: var(--bx-blue); }
.kpi-card.kpi-teal .kpi-value { color: #0D9488; }
.kpi-card.kpi-purple .kpi-value { color: #7C3AED; }

.kpi-card .kpi-icon {
	position: absolute;
	top: 14px;
	right: 16px;
	font-size: 20px;
	width: 40px;
	height: 40px;
	border-radius: var(--bx-radius-md);
	background: linear-gradient(120deg, rgba(20, 241, 177, 0.14), rgba(17, 78, 255, 0.1));
	border: 1px solid rgba(17, 78, 255, 0.1);
	display: flex;
	align-items: center;
	justify-content: center;
}

/* ==========================================================================
   Cards / panels
   ========================================================================== */
.portal-card {
	background: #fff;
	border: 1px solid var(--bx-gray-100);
	border-radius: var(--bx-radius-lg);
	box-shadow: var(--bx-shadow-card);
	margin-bottom: 22px;
	overflow: hidden;
}
.portal-card .card-head {
	padding: 16px 20px;
	border-bottom: 1px solid var(--bx-gray-100);
	display: flex;
	align-items: center;
	justify-content: space-between;
	gap: 12px;
	flex-wrap: wrap;
}
.portal-card .card-head h2 {
	font-size: 16px;
	font-weight: 600;
	margin: 0;
	color: var(--bx-navy);
	letter-spacing: -0.2px;
}
.portal-card .card-body { padding: 20px; }
.portal-card .card-body.flush { padding: 0; }

/* ==========================================================================
   Tables
   ========================================================================== */
.table-portal { width: 100%; border-collapse: collapse; font-size: 14px; }
.table-portal thead th {
	text-align: left;
	padding: 11px 16px;
	font-size: 11.5px;
	text-transform: uppercase;
	letter-spacing: 0.6px;
	color: var(--bx-gray-400);
	background: #FAFAFB;
	border-bottom: 1px solid var(--bx-gray-100);
	white-space: nowrap;
	font-weight: 600;
}
.table-portal tbody td { padding: 13px 16px; border-bottom: 1px solid #EEF0F4; vertical-align: top; }
.table-portal tbody tr:last-child td { border-bottom: none; }
.table-portal tbody tr { transition: background 0.12s ease; }
.table-portal tbody tr:hover td { background: #F9FAFC; }
.table-portal a { color: var(--bx-blue); font-weight: 600; text-decoration: none; transition: color 0.12s ease; }
.table-portal a:hover { color: var(--bx-navy); text-decoration: underline; }
.table-portal .muted { color: var(--bx-gray-400); font-size: 13px; }

/* ==========================================================================
   Status badges & priority chips (pill shaped)
   ========================================================================== */
.badge {
	display: inline-block;
	padding: 3px 12px;
	border-radius: 999px;
	font-size: 12px;
	font-weight: 600;
	white-space: nowrap;
	line-height: 18px;
}
.b-draft, .b-closed, .b-cancelled, .b-overdue, .b-pending { background: var(--bx-gray-100); color: var(--bx-gray-400); }
.b-requested, .b-open { background: #E8EEFF; color: var(--bx-blue); }
.b-scheduled { background: #E8EEFF; color: var(--bx-blue); }
.b-assigned { background: #ECE9FF; color: #5B3DF5; }
.b-approved { background: #E3F5FF; color: #0284C7; }
.b-sla-breached { background: #FDE8EB; color: #E11D48; }
.b-inprogress, .b-demo-in-progress { background: #FFF1E6; color: #D96C0A; }
.b-completed { background: #DCFBEA; color: #009A52; }
.b-converted { background: var(--bx-navy); color: #fff; box-shadow: 0 2px 8px rgba(17, 78, 255, 0.25); }
.b-followup-required { background: #FEF6D8; color: #A16207; }
.b-not-interested { background: #FDE8EB; color: #E11D48; }
.b-rescheduled { background: #F3E8FF; color: #7E22CE; }

.chip {
	display: inline-block;
	padding: 2px 10px;
	border-radius: 999px;
	font-size: 12px;
	font-weight: 600;
}
.chip.critical { background: #FDE8EB; color: #E11D48; }
.chip.high { background: #FFF1E6; color: #D96C0A; }
.chip.medium { background: #FEF6D8; color: #A16207; }
.chip.low { background: var(--bx-gray-100); color: var(--bx-gray-400); }

/* ==========================================================================
   Empty states
   ========================================================================== */
.empty-state { text-align: center; padding: 52px 20px; color: var(--bx-gray-400); }
.empty-state .empty-icon {
	font-size: 44px;
	opacity: 0.4;
	margin-bottom: 10px;
	display: inline-flex;
	width: 84px;
	height: 84px;
	align-items: center;
	justify-content: center;
	border-radius: 24px;
	background: var(--bx-gray-100);
}
.empty-state h3 { color: var(--bx-navy); font-size: 17px; margin: 0 0 6px; font-weight: 600; }
.empty-state p { margin: 0 0 16px; font-size: 14px; }

/* ==========================================================================
   Detail grids
   ========================================================================== */
.detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px; }
.detail-item .d-label {
	font-size: 11px;
	text-transform: uppercase;
	letter-spacing: 0.6px;
	color: var(--bx-gray-400);
	font-weight: 600;
}
.detail-item .d-value { font-size: 14px; font-weight: 600; margin-top: 3px; word-break: break-word; color: var(--bx-navy); }
.detail-item .d-value.wrap { white-space: pre-wrap; font-weight: 400; color: var(--bx-gray-500); }

/* ==========================================================================
   Forms — 8px radius inputs, navy focus, mint glow
   ========================================================================== */
.portal-form label { font-size: 13px; font-weight: 600; color: var(--bx-navy); display: block; margin: 14px 0 5px; }
.portal-form label .req { color: #E11D48; }
.portal-form input[type="text"], .portal-form input[type="date"], .portal-form input[type="time"],
.portal-form input[type="email"], .portal-form input[type="number"],
.portal-form select, .portal-form textarea {
	width: 100%;
	padding: 9px 12px;
	font-size: 14px;
	border: 1px solid #D9DCE3;
	border-radius: var(--bx-radius-sm);
